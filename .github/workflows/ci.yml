name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit -- --runInBand
      - name: Explain production audit paths
        run: |
          npm ls form-data path-to-regexp qs ws multer express body-parser --all || true
          npm audit fix --omit=dev --dry-run || true
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
