name: Refresh release lockfile

on:
  push:
    branches:
      - agent/release-20260725-credit-image-security

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refresh patched transitive lock entries without lifecycle scripts
        run: npm update brace-expansion gaxios --package-lock-only --ignore-scripts
      - name: Verify resolved dependency versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const packages = lock.packages || {};
          const braces = Object.entries(packages)
            .filter(([path]) => path === 'node_modules/brace-expansion' || path.endsWith('/node_modules/brace-expansion'))
            .map(([path, pkg]) => ({ path, version: pkg.version }));
          const gaxios = packages['node_modules/gaxios']?.version;
          if (braces.length !== 1 || braces[0].version !== '5.0.8' || gaxios !== '7.3.0') {
            throw new Error(`Unexpected dependency graph: ${JSON.stringify({ braces, gaxios })}`);
          }
          console.log(JSON.stringify({ braces, gaxios }));
          NODE
      - name: Verify strict dependency audit
        run: npm audit --audit-level=high
      - name: Commit lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh patched dependency lockfile"
          git push
